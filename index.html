    <script>
      (() => {
        const closestScrollable = (target) => {
          for (let el = target instanceof Element ? target : target?.parentElement; el && el !== document.body; el = el.parentElement) {
            const style = window.getComputedStyle(el);
            const canScrollY = /(auto|scroll)/.test(style.overflowY) && el.scrollHeight > el.clientHeight;
            const canScrollX = /(auto|scroll)/.test(style.overflowX) && el.scrollWidth > el.clientWidth;
            if (canScrollY || canScrollX) return { el, canScrollY, canScrollX };
          }
          return null;
        };

        const preventZoom = (event) => {
          event.preventDefault();
        };

        let lastTouchX = 0;
        let lastTouchY = 0;

        document.addEventListener("touchstart", (event) => {
          if (event.touches.length !== 1) return;
          lastTouchX = event.touches[0].clientX;
          lastTouchY = event.touches[0].clientY;
        }, { passive: true });

        document.addEventListener("gesturestart", preventZoom, { passive: false });
        document.addEventListener("gesturechange", preventZoom, { passive: false });
        document.addEventListener("gestureend", preventZoom, { passive: false });
        document.addEventListener("touchmove", (event) => {
          if (event.touches.length > 1) {
            event.preventDefault();
            return;
          }

          const touch = event.touches[0];
          const deltaX = touch.clientX - lastTouchX;
          const deltaY = touch.clientY - lastTouchY;
          const scrollable = closestScrollable(event.target);
          lastTouchX = touch.clientX;
          lastTouchY = touch.clientY;

          if (!scrollable) {
            event.preventDefault();
            return;
          }

          const { el, canScrollX, canScrollY } = scrollable;
          const atTop = el.scrollTop <= 0;
          const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
          const atLeft = el.scrollLeft <= 0;
          const atRight = el.scrollLeft + el.clientWidth >= el.scrollWidth - 1;
          const yBlocked = !canScrollY || (deltaY > 0 && atTop) || (deltaY < 0 && atBottom);
          const xBlocked = !canScrollX || (deltaX > 0 && atLeft) || (deltaX < 0 && atRight);

          if (Math.abs(deltaY) >= Math.abs(deltaX) ? yBlocked : xBlocked) {
            event.preventDefault();
          }
        }, { passive: false });
        document.addEventListener("wheel", (event) => {
          if (event.ctrlKey) event.preventDefault();
        }, { passive: false });
        document.addEventListener("keydown", (event) => {
          const key = event.key.toLowerCase();
          if ((event.ctrlKey || event.metaKey) && ["+", "-", "=", "0"].includes(key)) {
            event.preventDefault();
          }
        });
        document.addEventListener("dblclick", preventZoom, { passive: false });
      })();
    </script>

  <body>

        <path d="M17 42 8 53l3 3 11-9-5-5Z"/>

      </symbol>
      <symbol id="icon-shield" viewBox="0 0 64 64">
        <path d="M32 5 55 14v17c0 15-9 24-23 29C18 55 9 46 9 31V14L32 5Z"/>
        <path d="M32 14 19 19v12c0 9 4 14 13 19 9-5 13-10 13-19V19l-13-5Z"/>

      </symbol>

        <path d="M31 58c-7-2-11-7-11-14 0-6 4-10 8-15 1 7 7 10 7 10 0-7 3-12 6-17 5 7 8 13 8 21 0 9-8 15-18 15Z"/>

    <div id="scaleMount" class="scale-mount">
    <div id="appShell" class="app-shell">
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg><use href="#icon-core"></use></svg>
          </div>
          <div class="brand-copy">
            <div class="brand-title-row">
              <div class="brand-name">
                <p class="brand-kana">クロノドライブ</p>
                <h1>Chrono Drive</h1>
              </div>
              <div class="header-account" aria-label="アカウント">
                <span id="accountUsernameLabel" class="account-username-label">ユーザー名</span>
                <input id="displayNameInput" type="text" autocomplete="nickname" maxlength="24" placeholder="ゲーム内名">
                <button id="saveDisplayNameButton" class="ghost-button" type="button">変更</button>
                <button id="loginButton" class="ghost-button" type="button">ログイン</button>
                <button id="logoutButton" class="ghost-button" type="button">ログアウト</button>
              </div>
            </div>
          </div>
        </div>
        <nav class="view-tabs" aria-label="画面切替">
          <button id="builderTab" class="tab-button active" type="button">デッキ編集</button>
          <button id="packTab" class="tab-button" type="button">パック開封</button>
          <button id="duelTab" class="tab-button" type="button">デュエル</button>
        </nav>
        <div class="header-actions resource-strip" aria-label="所持アイテム">
          <span class="resource-pill" title="ガチャ石"><img class="item-icon" src="assets/ui/gacha-stone.png" alt=""> <strong id="headerGachaStoneCount">0</strong></span>
          <span class="resource-pill" title="分解石"><img class="item-icon" src="assets/ui/dismantle-stone.png" alt=""> <strong id="headerDustCount">0</strong></span>
        </div>
      </header>

      <main>
        <section id="builderView" class="view builder-view">
          <section class="library-panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Card Pool</p>
                <h2>カード一覧</h2>
              </div>
              <div class="pool-actions">
                <button id="bulkDismantleButton" class="ghost-button compact-action" type="button">一括分解</button>
                <span id="poolCount" class="soft-badge">0種</span>
              </div>
            </div>
            <div class="filters">
              <label>
                <span>検索</span>
                <input id="searchInput" type="search" autocomplete="off" placeholder="カード名">
              </label>
              <label>
                <span>種別</span>
                <select id="typeFilter">
                  <option value="all">すべて</option>
                  <option value="ユニット">ユニット</option>
                  <option value="スペル">スペル</option>
                  <option value="リアクション">リアクション</option>
                  <option value="コア">コア</option>
                  <option value="ユニットドライブ">ユニットドライブ</option>
                  <option value="スペルドライブ">スペルドライブ</option>
                  <option value="リアクションドライブ">リアクションドライブ</option>
                  <option value="コアドライブ">コアドライブ</option>
                </select>
              </label>
              <label>
                <span>属性</span>
                <select id="attrFilter">
                  <option value="all">すべて</option>
                  <option value="光">光</option>
                  <option value="炎">炎</option>
                  <option value="影">影</option>
                  <option value="無">無</option>
                </select>
              </label>
              <button id="ownedOnlyToggle" class="filter-toggle-button" type="button" aria-pressed="false">全カード</button>
            </div>
            <div id="collectionGrid" class="collection-grid" aria-label="カード一覧"></div>
          </section>

          <aside class="deck-panel">
            <div class="panel-head">
              <div>
                <p id="deckPanelEyebrow" class="eyebrow">Main Deck</p>
                <h2 id="deckPanelTitle">構築デッキ</h2>
              </div>
              <div class="deck-panel-actions">
                <strong id="deckCount" class="deck-count">40 / 40</strong>
                <button id="saveDeckButton" class="ghost-button" type="button">保存</button>
              </div>
            </div>
            <div class="deck-mode-tabs" aria-label="デッキ編集切替">
              <button id="mainDeckModeButton" class="deck-mode-button active" type="button">通常デッキ</button>
              <button id="driveDeckModeButton" class="deck-mode-button" type="button">ドライブデッキ</button>
            </div>
            <div id="deckStats" class="deck-stats deck-panel-stats">
              <div>
                <span>テーマ純度</span>
                <strong id="themeRate">0%</strong>
              </div>
              <div>
                <span>平均コスト</span>
                <strong id="avgCost">0.0</strong>
              </div>
              <div>
                <span>リアクション</span>
                <strong id="reactionCount">0</strong>
              </div>
            </div>
            <div id="deckList" class="deck-list" aria-label="デッキリスト"></div>
          </aside>

          <aside class="preview-panel" aria-label="カード詳細">
            <div id="cardPreview" class="preview-card-slot"></div>
            <div id="previewDeckControls" class="preview-deck-controls" aria-label="選択カードの投入枚数"></div>
            <section class="deck-profile-panel" aria-label="デッキ保存">
              <div class="profile-grid">
                <label class="profile-field preset-select-field">
                  <span>プリセット</span>
                  <select id="deckPresetSelect"></select>
                </label>
                <button id="loadDeckButton" class="ghost-button" type="button">読込</button>
                <label class="profile-field deck-name-field">
                  <span>デッキ名</span>
                  <input id="deckNameInput" type="text" autocomplete="off" maxlength="32">
                </label>
                <button id="savePresetButton" class="ghost-button" type="button">上書き</button>
                <button id="saveAsPresetButton" class="ghost-button" type="button">新規保存</button>
                <button id="deletePresetButton" class="ghost-button danger" type="button">削除</button>
              </div>
              <div class="auto-build-row">
                <label class="profile-field">
                  <span>おまかせ</span>
                  <select id="autoBuildMode">
                    <option value="star">星導</option>
                    <option value="black">黒機</option>
                    <option value="blade">断刃</option>
                    <option value="cyber">電脳</option>
                    <option value="sosai">双彩</option>
                    <option value="balance">バランス</option>
                  </select>
                </label>
                <button id="autoBuildButton" class="primary-button" type="button">おまかせ編成</button>
              </div>
            </section>
          </aside>
        </section>

        <section id="packView" class="view pack-view" hidden>
          <section class="pack-selection-panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Card Pack</p>
                <h2>パック開封</h2>
              </div>
            </div>
            <div id="packList" class="pack-list" aria-label="パック一覧"></div>
          </section>

          <section class="pack-open-panel">
            <div class="panel-head">
              <div>
                <p id="selectedPackEyebrow" class="eyebrow">Selected Pack</p>
                <h2 id="selectedPackTitle">パックを選択</h2>
              </div>
              <button id="openSelectedPackButton" class="primary-button" type="button">100で開封</button>
            </div>
            <div id="packResultGrid" class="pack-result-list pack-page-results" aria-label="開封結果"></div>
          </section>
        </section>

        <section id="duelView" class="view duel-view" hidden>
          <section class="duel-topline">
            <div class="duelist-summary">
              <span class="nameplate enemy">CPU: 黒機</span>
              <div class="lp-bar"><span id="enemyLpBar"></span></div>
              <strong id="enemyLp">8000</strong>
            </div>
            <div class="phase-strip">
              <span id="turnBadge" class="soft-badge">Turn 1</span>
              <span id="phaseBadge" class="phase-badge">自分ターン</span>
              <div class="duel-actions">
                <button id="createRoomButton" class="ghost-button" type="button">ルーム作成</button>
                <button id="joinRoomButton" class="ghost-button" type="button">ルーム参加</button>
                <button id="newDuelButton" class="primary-button" type="button">対戦開始</button>
              </div>
            </div>
            <div class="duelist-summary player">
              <span class="nameplate">Player</span>
              <div class="lp-bar"><span id="playerLpBar"></span></div>
              <strong id="playerLp">8000</strong>
            </div>
          </section>

          <section class="duel-table">
            <aside class="info-rail">
              <section class="selected-panel">
                <div class="panel-head compact">
                  <h2>フォーカス</h2>
                </div>
                <div id="selectedCardPanel" class="selected-card-panel"></div>
                <div id="contextActions" class="context-actions"></div>
              </section>
              <section class="log-panel">
                <div class="panel-head compact">
                  <h2>ログ</h2>
                </div>
                <ol id="battleLog" class="battle-log"></ol>
              </section>
            </aside>

            <section class="board-area" aria-label="デュエル盤面">
              <div class="side-board opponent-side">
                <div class="zone-heading">
                  <span>相手フィールド</span>
                  <span id="enemyDeckInfo">山札 0</span>
                </div>
                <div id="enemyCharge" class="charge-row compact-row"></div>
                <div id="enemyDrivePile" class="drive-pile-field opponent-drive-pile" role="img" aria-label="相手のドライブデッキ"></div>
                <div id="enemyHandZone" class="enemy-hand-zone" aria-label="相手の手札"></div>
                <div id="enemyCoreZones" class="zone-row core-row"></div>
                <div id="enemyUnitZones" class="zone-row unit-row"></div>
                <div id="enemyReactionZones" class="zone-row reaction-row"></div>
                <div class="pile-zones opponent-piles" aria-label="相手の山札と捨て札">
                  <div id="enemyDeckPile" class="pile-slot deck-pile" role="img" aria-label="相手の山札"></div>
                  <div id="enemyGravePile" class="pile-slot grave-pile" role="img" aria-label="相手の捨て札"></div>
                </div>
              </div>

              <div class="center-command" hidden>
                <button id="endTurnButton" class="primary-button" type="button">ターン終了</button>
                <button id="restartDuelButton" class="ghost-button" type="button">再戦</button>
              </div>

              <div class="side-board player-side">
                <div class="zone-heading">
                  <span>自分フィールド</span>
                  <span id="playerDeckInfo">山札 0</span>
                </div>
                <div id="playerReactionZones" class="zone-row reaction-row"></div>
                <div id="playerUnitZones" class="zone-row unit-row"></div>
                <div id="playerCoreZones" class="zone-row core-row"></div>
                <div id="playerCharge" class="charge-row"></div>
                <div id="playerDrivePile" class="drive-pile-field player-drive-pile" role="button" tabindex="0" aria-label="自分のドライブデッキ"></div>
                <div class="pile-zones player-piles" aria-label="自分の山札と捨て札">
                  <div id="playerDeckPile" class="pile-slot deck-pile" role="img" aria-label="自分の山札"></div>
                  <div id="playerGravePile" class="pile-slot grave-pile" role="img" aria-label="自分の捨て札"></div>
                </div>
              </div>

              <div class="hand-wrap">
                <div class="zone-heading">
                  <span>手札</span>
                  <span id="handInfo">0枚</span>
                </div>
                <div id="handZone" class="hand-zone"></div>
              </div>
            </section>
          </section>
        </section>
      </main>
      <div id="modalRoot" class="modal-root" hidden></div>
    </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
